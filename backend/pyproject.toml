[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bzmap"
version = "0.1.0"
description = "Bundled bzmap backend for the BattleZone 98 Godot Map Editor"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "Pillow",
    "imageio",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["bzmap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
